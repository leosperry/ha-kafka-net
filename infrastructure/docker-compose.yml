services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: "unless-stopped"
    ports:
      - "2181:2181"
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://192.168.1.3:9094 # <-----  modify EXTERNAL ip address. This makes it so that your HaKafkaNet instance can communicate with kafka
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

  # initializes topics
  init-kafka:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
        /opt/kafka/bin/kafka-topics.sh --topic home_assistant_states --bootstrap-server kafka:9092 --if-not-exists --config "cleanup.policy=compact" --create
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --entity-type topics --entity-name home_assistant_states --alter --add-config max.compaction.lag.ms=1800000

  # recommended but optional
  # you must provide an IDistributed cache implementation
  # see https://github.com/leosperry/ha-kafka-net/wiki/Data-Persistence for additional information
  cache:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server
    ports:
      - 6379:6379

  # kafka ui is optional. It is provided here for your convenience
  # can be used to inspect and customize your kafka instance
  kafka-ui:
    image: kafbat/kafka-ui
    container_name: kafka-ui
    depends_on:
      - kafka
    restart: "unless-stopped"
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
